<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Management</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<header>
<h1>👷 Employee Management</h1>
</header>

<main>

<div class="card">

<h2>Add Employee</h2>

<input id="employeeName" placeholder="Employee Name">

<input id="employeePhone" placeholder="Phone">

<input id="employeeEmail" placeholder="Email">

<input id="employeeRole" placeholder="Role">

<input id="employeePay" type="number" placeholder="Hourly Pay">

<button onclick="addEmployee()">
Add Employee
</button>

</div>

<div class="card">

<h2>Employees</h2>

<div id="employeeList"></div>

</div>

</main>

<script src="employees.js"></script>

</body>
</html>
