<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Registry</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<header>
    <h1>🐄 Ranch Animal Registry</h1>
    <p id="ranchTitle">Livestock Tracking System</p>
</header>

<nav>
    <a href="index.html">Dashboard</a>
    <a href="animals.html">Animals</a>
    <a href="health.html">Health</a>
    <a href="breeding.html">Breeding</a>
    <a href="inventory.html">Inventory</a>
    <a href="finance.html">Finance</a>
    <a href="workorders.html">Work Orders</a>
    <a href="employees.html">Employees</a>
    <a href="reports.html">Reports</a>
</nav>

<main>

<div class="card">

    <h2>Add Animal</h2>

    <input id="tagNumber" placeholder="Tag Number">
    <input id="species" placeholder="Species (Cattle, Horse, etc)">
    <input id="breed" placeholder="Breed">

    <select id="sex">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>

    <input id="weight" type="number" placeholder="Weight (lbs)">
    <input id="birthDate" type="date">

    <textarea id="notes" placeholder="Notes"></textarea>

    <button onclick="addAnimal()">
        Add Animal
    </button>

</div>

<div class="card">

    <h2>Livestock List</h2>

    <div id="animalList">Loading...</div>

</div>

</main>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}
</script>

</body>
</html>
