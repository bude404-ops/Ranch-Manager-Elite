<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Registry</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<header>
    <h1>🐄 Animal Registry</h1>
    <p>Livestock Tracking System</p>
</header>

<nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="animals.html">Animals</a>
    <a href="finance.html">Finance</a>
    <a href="inventory.html">Inventory</a>
    <a href="health.html">Health</a>
    <a href="reports.html">Reports</a>
    <a href="settings.html">Settings</a>
</nav>

<main>

<div class="card">

    <h2>Add Animal</h2>

    <input id="tagNumber" placeholder="Tag Number">
    <input id="species" placeholder="Species (Cattle, Horse, etc)">
    <input id="breed" placeholder="Breed">

    <select id="sex">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>

    <input id="weight" type="number" placeholder="Weight (lbs)">
    <input id="birthDate" type="date">

    <textarea id="notes" placeholder="Notes"></textarea>

    <button onclick="addAnimal()">
        Add Animal
    </button>

</div>

<div class="card">

    <h2>Livestock List</h2>

    <div id="animalList"></div>

</div>

</main>

<script src="animals.js"></script>

</body>
</html>
