<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<header>
    <h1>⚙️ Ranch Settings</h1>
</header>

<nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="animals.html">Animals</a>
    <a href="finance.html">Finance</a>
    <a href="reports.html">Reports</a>
    <a href="settings.html">Settings</a>
</nav>

<main>

<div class="card">

    <h2>Ranch Information</h2>

    <input
        id="ranchName"
        placeholder="Ranch Name">

    <input
        id="ownerName"
        placeholder="Owner Name">

    <button onclick="saveSettings()">
        Save Settings
    </button>

</div>

<div class="card">

    <h2>Subscription</h2>

    <select id="subscriptionPlan">

        <option value="FREE">
            Free
        </option>

        <option value="PRO">
            Pro
        </option>

        <option value="ENTERPRISE">
            Enterprise
        </option>

    </select>

    <button onclick="saveSubscription()">
        Update Plan
    </button>

</div>

<div class="card">

    <h2>Founder Access Code</h2>

    <input
        id="founderCode"
        placeholder="Enter Founder Code">

    <button onclick="activateFounderCode()">
        Activate
    </button>

    <p id="founderStatus"></p>

</div>

<div class="card">

    <h2>Data Management</h2>

    <button onclick="exportData()">
        Export Ranch Data
    </button>

    <br><br>

    <button onclick="clearData()">
        Reset All Data
    </button>

</div>

</main>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}
</script>

</body>
</html>
