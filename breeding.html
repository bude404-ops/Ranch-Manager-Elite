<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breeding Management</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<header>
    <h1>🐄 Breeding Management</h1>
    <p>Herd Reproduction Tracking System</p>
</header>

<nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="animals.html">Animals</a>
    <a href="health.html">Health</a>
    <a href="breeding.html">Breeding</a>
    <a href="inventory.html">Inventory</a>
    <a href="finance.html">Finance</a>
    <a href="reports.html">Reports</a>
</nav>

<main>

<div class="card">

    <h2>Add Breeding Record</h2>

    <input id="femaleTag" placeholder="Female Tag (Dam)">
    <input id="maleTag" placeholder="Male Tag (Sire)">

    <select id="breedingStatus">
        <option>Pregnant</option>
        <option>Confirmed</option>
        <option>Calved</option>
        <option>Failed</option>
    </select>

    <input id="breedingDate" type="date">
    <input id="expectedDate" type="date">

    <textarea id="notes" placeholder="Notes"></textarea>

    <button onclick="addBreedingRecord()">
        Add Breeding Record
    </button>

</div>

<div class="card">

    <h2>Breeding Records</h2>

    <div id="breedingList"></div>

</div>

</main>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}
</script>

</body>
</html>
