<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breeding Management</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<header>
    <h1>🐮 Breeding Management</h1>
    <p>Pregnancy & Calving Records</p>
</header>

<nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="animals.html">Animals</a>
    <a href="breeding.html">Breeding</a>
    <a href="health.html">Health</a>
    <a href="inventory.html">Inventory</a>
    <a href="finance.html">Finance</a>
    <a href="reports.html">Reports</a>
    <a href="settings.html">Settings</a>
</nav>

<main>

<div class="card">

    <h2>Add Breeding Record</h2>

    <input
        id="damTag"
        placeholder="Dam Tag">

    <input
        id="sireTag"
        placeholder="Sire Tag">

    <input
        id="breedingDate"
        type="date">

    <input
        id="expectedCalving"
        type="date">

    <select id="pregnancyStatus">

        <option>Exposed</option>
        <option>Confirmed Pregnant</option>
        <option>Open</option>
        <option>Calved</option>

    </select>

    <textarea
        id="breedingNotes"
        placeholder="Breeding Notes"></textarea>

    <button onclick="addBreedingRecord()">
        Save Record
    </button>

</div>

<div class="card">

    <h2>Breeding Records</h2>

    <div id="breedingList"></div>

</div>

</main>

<script src="breeding.js"></script>

</body>
</html>
