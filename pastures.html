<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasture Management</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<header>
    <h1>🌾 Pasture Management</h1>
</header>

<nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="animals.html">Animals</a>
    <a href="finance.html">Finance</a>
    <a href="inventory.html">Inventory</a>
    <a href="health.html">Health</a>
    <a href="pastures.html">Pastures</a>
    <a href="reports.html">Reports</a>
    <a href="settings.html">Settings</a>
</nav>

<main>

<div class="card">

    <h2>Add Pasture</h2>

    <input
        id="pastureName"
        placeholder="Pasture Name">

    <input
        id="pastureAcres"
        type="number"
        placeholder="Acres">

    <input
        id="animalCapacity"
        type="number"
        placeholder="Animal Capacity">

    <select id="pastureStatus">
        <option>Available</option>
        <option>In Use</option>
        <option>Resting</option>
    </select>

    <button onclick="addPasture()">
        Save Pasture
    </button>

</div>

<div class="card">

    <h2>Pasture List</h2>

    <div id="pastureList"></div>

</div>

</main>

<script src="pastures.js"></script>

</body>
</html>
