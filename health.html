<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Records</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<header>
    <h1>🩺 Animal Health Records</h1>
    <p>Vaccinations, Treatments & Vet Logs</p>
</header>

<nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="animals.html">Animals</a>
    <a href="finance.html">Finance</a>
    <a href="inventory.html">Inventory</a>
    <a href="health.html">Health</a>
    <a href="reports.html">Reports</a>
    <a href="settings.html">Settings</a>
</nav>

<main>

<div class="card">

    <h2>Add Health Record</h2>

    <input id="animalTag" placeholder="Animal Tag (Required)">

    <select id="recordType">

        <option>Vaccination</option>
        <option>Injury</option>
        <option>Treatment</option>
        <option>Checkup</option>
        <option>Surgery</option>
        <option>Deworming</option>

    </select>

    <input id="treatment" placeholder="Treatment / Medication">
    <input id="vetName" placeholder="Vet Name (Optional)">
    <input id="date" type="date">

    <textarea id="notes" placeholder="Notes"></textarea>

    <button onclick="addHealthRecord()">
        Add Record
    </button>

</div>

<div class="card">

    <h2>Health Records</h2>

    <div id="healthList"></div>

</div>

</main>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}
</script>

</body>
</html>
