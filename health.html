<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Health Center</title>
<link rel="stylesheet" href="main.css">
</head>
<body>

<header>
    <h1>🩺 Animal Health Center</h1>
    <p>Health Records & Treatments</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="animals.html">Animals</a>
    <a href="finance.html">Finance</a>
    <a href="inventory.html">Inventory</a>
    <a href="reports.html">Reports</a>
    <a href="settings.html">Settings</a>
</nav>

<main>

<div class="card">

    <h2>Add Health Record</h2>

    <input id="animalTag"
           placeholder="Animal Tag">

    <input id="recordDate"
           type="date">

    <select id="recordType">

        <option>Vaccination</option>
        <option>Treatment</option>
        <option>Vet Visit</option>
        <option>Weight Check</option>
        <option>Pregnancy Check</option>
        <option>Other</option>

    </select>

    <textarea id="recordNotes"
              placeholder="Notes"></textarea>

    <button onclick="addHealthRecord()">
        Save Record
    </button>

</div>

<div class="card">

    <h2>Health Records</h2>

    <div id="healthList"></div>

</div>

</main>

<script src="health.js"></script>

</body>
</html>
