<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranch Manager Elite Dashboard</title>
<link rel="stylesheet" href="main.css">
</head>

<body>

<header class="topbar">
    <div>
        <h1>🐄 Ranch Manager Elite</h1>
        <p id="ranchTitle">Operations Dashboard</p>
    </div>

    <div class="plan-badge">
        <span id="planName">FREE</span>
    </div>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="animals.html">Animals</a>
    <a href="inventory.html">Inventory</a>
    <a href="finance.html">Finance</a>
    <a href="reports.html">Reports</a>
    <a href="settings.html">Settings</a>
</nav>

<main>

<!-- HERO STATS -->
<div class="dashboard-grid">

    <div class="card stat">
        <h3>🐄 Animals</h3>
        <p id="animalCount">0</p>
    </div>

    <div class="card stat">
        <h3>📦 Inventory</h3>
        <p id="inventoryCount">0</p>
    </div>

    <div class="card stat">
        <h3>💰 Income</h3>
        <p id="totalIncome">$0</p>
    </div>

    <div class="card stat">
        <h3>💸 Expenses</h3>
        <p id="totalExpenses">$0</p>
    </div>

    <div class="card stat highlight">
        <h3>📈 Net Profit</h3>
        <p id="netProfit">$0</p>
    </div>

</div>

<!-- QUICK ACTIONS -->
<div class="card section">

    <h2>⚡ Quick Actions</h2>

    <div class="action-grid">

        <button onclick="location.href='animals.html'">Add Animal</button>
        <button onclick="location.href='inventory.html'">Inventory</button>
        <button onclick="location.href='finance.html'">Finance</button>
        <button onclick="location.href='reports.html'">Reports</button>

    </div>

</div>

<!-- INSIGHTS PANEL -->
<div class="dashboard-bottom">

    <div class="card">
        <h2>📊 System Overview</h2>
        <div id="ranchSummary">Loading...</div>
    </div>

    <div class="card">
        <h2>🚨 Alerts</h2>
        <div id="lowStockAlerts">No alerts</div>
    </div>

</div>

</main>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}
</script>

</body>
</html>
