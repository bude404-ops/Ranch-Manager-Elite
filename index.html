<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ranch Manager Elite</title>

<link rel="stylesheet" href="css/styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header class="topbar">
    <h1 id="ranchTitle">Ranch Manager Elite</h1>
    <button onclick="toggleNav()">☰</button>
</header>

<nav id="navMenu" class="nav">
    <button onclick="showSection('dashboard')">Dashboard</button>
    <button onclick="showSection('animals')">Animals</button>
    <button onclick="showSection('finance')">Finance</button>
</nav>

<main>

<!-- DASHBOARD -->
<section id="dashboard" class="section active">

    <h2>Dashboard</h2>

    <div class="card" id="ranchSummary"></div>

    <canvas id="profitChart"></canvas>

</section>

<!-- ANIMALS -->
<section id="animals" class="section hidden">

    <h2>Animals</h2>

    <input id="tagNumber" placeholder="Tag Number"/>
    <input id="species" placeholder="Species"/>
    <input id="breed" placeholder="Breed"/>

    <button onclick="addAnimal()">Add Animal</button>

    <div id="animalList"></div>

</section>

<!-- FINANCE -->
<section id="finance" class="section hidden">

    <h2>Finance</h2>

    <input id="transactionName" placeholder="Description"/>
    <input id="transactionAmount" type="number" placeholder="Amount"/>

    <select id="transactionType">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
    </select>

    <button onclick="addTransaction()">Add Transaction</button>

    <div id="transactionList"></div>

    <div class="card">
        <p>Income: <span id="totalIncome"></span></p>
        <p>Expenses: <span id="totalExpenses"></span></p>
        <p>Profit: <span id="netProfit"></span></p>
    </div>

</section>

</main>

<script src="js/storage.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>

</body>
</html>
