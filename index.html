<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ranch Manager Elite</title>

<style>
/* =========================
   BASE
========================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f8;
    overflow-x: hidden;
}

/* =========================
   TOP BAR
========================= */
header {
    height: 60px;
    background: #2f6b3f;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 15px;
    justify-content: space-between;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
}

.menu-btn {
    font-size: 26px;
    cursor: pointer;
    user-select: none;
}

/* =========================
   SIDEBAR
========================= */
.sidebar {
    position: fixed;
    top: 60px;
    left: -260px;
    width: 260px;
    height: calc(100% - 60px);
    background: #1f3d2a;
    color: white;
    transition: transform 0.25s ease;
    transform: translateX(0);
    z-index: 999;
    padding-top: 10px;
    will-change: transform;
}

.sidebar.open {
    transform: translateX(260px);
}

/* links */
.sidebar a {
    display: block;
    padding: 15px;
    color: white;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    user-select: none;
}

.sidebar a:active {
    background: rgba(255,255,255,0.1);
}

/* =========================
   OVERLAY
========================= */
.overlay {
    position: fixed;
    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 998;
}

.overlay.show {
    opacity: 1;
    pointer-events: all;
}

/* =========================
   MAIN
========================= */
main {
    margin-top: 60px;
    padding: 20px;
}
</style>
</head>

<body>

<header>
    <div class="menu-btn" id="menuBtn">☰</div>
    <h3>Ranch Manager</h3>
</header>

<div class="sidebar" id="sidebar">
    <a href="#" data-page="dashboard">Dashboard</a>
    <a href="#" data-page="animals">Animals</a>
    <a href="#" data-page="tasks">Tasks</a>
    <a href="#" data-page="settings">Settings</a>
</div>

<div class="overlay" id="overlay"></div>

<main id="main">
    <h2>Dashboard</h2>
    <p>Welcome to your ranch system.</p>
</main>

<script>
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const menuBtn = document.getElementById("menuBtn");
const links = sidebar.querySelectorAll("a");
const main = document.getElementById("main");

function openSidebar() {
    sidebar.classList.add("open");
    overlay.classList.add("show");
}

function closeSidebar() {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
}

function toggleSidebar() {
    if (sidebar.classList.contains("open")) {
        closeSidebar();
    } else {
        openSidebar();
    }
}

/* IMPORTANT: pointer events = mobile fix */
menuBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    toggleSidebar();
});

overlay.addEventListener("pointerdown", closeSidebar);

links.forEach(link => {
    link.addEventListener("pointerdown", (e) => {
        e.preventDefault();

        const page = link.getAttribute("data-page");

        main.innerHTML = `
            <h2>${page.charAt(0).toUpperCase() + page.slice(1)}</h2>
            <p>Loaded ${page} page</p>
        `;

        closeSidebar();
    });
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeSidebar();
});
</script>

</body>
</html>
