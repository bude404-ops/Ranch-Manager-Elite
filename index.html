<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ranch Manager Elite V2</title>

<link rel="stylesheet" href="css/styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
    <h1>🐄 Ranch Manager Elite</h1>
    <button onclick="toggleNav()">Menu</button>
</header>

<nav id="navMenu">
    <button onclick="showSection('dashboard')">Dashboard</button>
    <button onclick="showSection('animals')">Animals</button>
    <button onclick="showSection('inventory')">Inventory</button>
    <button onclick="showSection('finance')">Finance</button>
</nav>

<main>

<!-- DASHBOARD -->
<section id="dashboard" class="section">
    <h2>Dashboard</h2>

    <div class="card">
        <h3>Overview</h3>
        <div id="ranchSummary"></div>
    </div>

    <div class="card">
        <canvas id="profitChart"></canvas>
    </div>
</section>

<!-- ANIMALS -->
<section id="animals" class="section hidden">
    <h2>Animals</h2>

    <input id="tagNumber" placeholder="Tag Number"/>
    <input id="species" placeholder="Species"/>
    <input id="breed" placeholder="Breed"/>

    <button onclick="addAnimal()">Add Animal</button>

    <div id="animalList"></div>
</section>

<!-- INVENTORY -->
<section id="inventory" class="section hidden">
    <h2>Inventory</h2>

    <input id="itemName" placeholder="Item Name"/>
    <input id="itemQuantity" type="number" placeholder="Quantity"/>
    <input id="reorderLevel" type="number" placeholder="Reorder Level"/>

    <button onclick="addInventory()">Add Item</button>

    <div id="inventoryList"></div>
</section>

<!-- FINANCE -->
<section id="finance" class="section hidden">
    <h2>Finance</h2>

    <input id="transactionName" placeholder="Description"/>
    <input id="transactionAmount" type="number" placeholder="Amount"/>

    <select id="transactionType">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
    </select>

    <button onclick="addTransaction()">Add Transaction</button>

    <div id="transactionList"></div>

    <div class="card">
        <p>Income: <span id="totalIncome"></span></p>
        <p>Expenses: <span id="totalExpenses"></span></p>
        <p>Profit: <span id="netProfit"></span></p>
    </div>
</section>

</main>

<script src="js/core.js"></script>
<script src="js/animals.js"></script>
<script src="js/inventory.js"></script>
<script src="js/finance.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>

</body>
</html>
