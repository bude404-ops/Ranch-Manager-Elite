<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ranch Manager Elite</title>

<link rel="stylesheet" href="css/styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header class="nav-bar">
    <div class="nav-title" id="ranchTitle">Ranch Manager Elite</div>
    <button class="nav-toggle" onclick="toggleNav()">☰</button>
</header>

<nav id="navMenu" class="nav-menu">
    <a href="#" onclick="showSection('dashboard')">Dashboard</a>
    <a href="#" onclick="showSection('animals')">Animals</a>
    <a href="#" onclick="showSection('inventory')">Inventory</a>
    <a href="#" onclick="showSection('finance')">Finance</a>
</nav>

<main>

<!-- DASHBOARD -->
<section id="dashboard" class="page">
    <h2>Dashboard</h2>

    <div class="dashboard-grid">

        <div class="card stat">
            <h3>Animals</h3>
            <p id="animalCount">0</p>
        </div>

        <div class="card stat">
            <h3>Inventory</h3>
            <p id="inventoryCount">0</p>
        </div>

        <div class="card stat highlight">
            <h3>Profit</h3>
            <p id="netProfit">$0</p>
        </div>

    </div>

    <div class="card">
        <h3>Profit Trend</h3>
        <canvas id="profitChart"></canvas>
    </div>
</section>

<!-- ANIMALS -->
<section id="animals" class="page hidden">
    <h2>Animals</h2>

    <input id="tagNumber" placeholder="Tag Number"/>
    <input id="species" placeholder="Species"/>
    <input id="breed" placeholder="Breed"/>

    <button onclick="addAnimal()">Add Animal</button>

    <div id="animalList"></div>
</section>

<!-- INVENTORY -->
<section id="inventory" class="page hidden">
    <h2>Inventory</h2>

    <input id="itemName" placeholder="Item Name"/>
    <input id="itemQuantity" type="number" placeholder="Quantity"/>
    <input id="reorderLevel" type="number" placeholder="Reorder Level"/>

    <button onclick="addInventoryItem()">Add Item</button>

    <div id="inventoryList"></div>
</section>

<!-- FINANCE -->
<section id="finance" class="page hidden">
    <h2>Finance</h2>

    <input id="transactionName" placeholder="Description"/>
    <input id="transactionAmount" type="number" placeholder="Amount"/>

    <select id="transactionType">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
    </select>

    <button onclick="addTransaction()">Add Transaction</button>

    <div id="transactionList"></div>

    <div class="card">
        <p>Income: <span id="totalIncome">$0</span></p>
        <p>Expenses: <span id="totalExpenses">$0</span></p>
        <p>Profit: <span id="netProfit">$0</span></p>
    </div>
</section>

</main>

<script src="js/charts.js"></script>
<script src="js/app.js"></script>

</body>
</html>
