<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ranch Elite OS</title>
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>

<!-- TOP BAR -->
<header class="topbar">
    <button id="menuBtn">☰</button>
    <div class="title">Ranch OS</div>
    <button id="aiBtn">AI</button>
</header>

<!-- BACKDROP -->
<div id="backdrop"></div>

<!-- SIDEBAR (FINAL STRUCTURE - NEVER CHANGE AGAIN) -->
<aside id="sidebar" class="sidebar">
    <div class="sidebar-header">Menu</div>

    <a class="nav-item" data-view="dashboard">Dashboard</a>
    <a class="nav-item" data-view="animals">Animals</a>
    <a class="nav-item" data-view="tasks">Tasks</a>
    <a class="nav-item" data-view="inventory">Inventory</a>
    <a class="nav-item" data-view="economy">Economy</a>
</aside>

<!-- MAIN VIEWS -->
<main class="app">

    <section id="dashboard" class="view active">
        <h2>Dashboard</h2>
        <div id="dashboardBox"></div>
    </section>

    <section id="animals" class="view">
        <h2>Animals</h2>
        <button data-action="add-animal">Add Animal</button>
        <div id="animalsBox"></div>
    </section>

    <section id="tasks" class="view">
        <h2>Tasks</h2>
        <button data-action="add-task">Add Task</button>
        <div id="tasksBox"></div>
    </section>

    <section id="inventory" class="view">
        <h2>Inventory</h2>
        <div id="inventoryBox"></div>
    </section>

    <section id="economy" class="view">
        <h2>Economy</h2>
        <div id="economyBox"></div>
    </section>

</main>

<!-- ONLY TWO SCRIPTS EVER -->
<script src="ui.js"></script>
<script src="app.js"></script>

</body>
</html>
