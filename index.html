<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranch OS</title>

<style>
/* =========================
   RESET
========================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #0f0f0f;
    color: white;
}

/* lock scroll when menu open */
body.sidebar-open {
    overflow: hidden;
}

/* =========================
   TOP BAR
========================= */
.topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: #2f6b3f;
    display: flex;
    align-items: center;
    padding: 0 15px;
    z-index: 2000;
}

.menu-icon {
    font-size: 26px;
    cursor: pointer;
    margin-right: 15px;
    user-select: none;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

/* =========================
   SIDEBAR
========================= */
.sidenav {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    height: 100%;
    background: #1c1c1c;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 2100;
    padding-top: 70px;
    box-shadow: 2px 0 10px rgba(0,0,0,0.5);
}

.sidenav.active {
    transform: translateX(0);
}

.sidenav a {
    display: block;
    padding: 15px 20px;
    color: white;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.sidenav a:active {
    background: rgba(255,255,255,0.1);
}

/* =========================
   OVERLAY (CRITICAL FIX)
========================= */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 2005;
}

.overlay.active {
    opacity: 1;
    pointer-events: all;
}

/* =========================
   CONTENT
========================= */
.content {
    margin-top: 60px;
    padding: 20px;
}

.card {
    background: #1a1a1a;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="menu-icon" id="menuBtn">☰</div>
    <div class="title">Ranch OS</div>
</div>

<!-- SIDEBAR -->
<div class="sidenav" id="sidebar">
    <a href="#">Dashboard</a>
    <a href="#">Livestock</a>
    <a href="#">Inventory</a>
    <a href="#">Equipment</a>
    <a href="#">Employees</a>
    <a href="#">Work Orders</a>
    <a href="#">Finance</a>
    <a href="#">Settings</a>
</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- CONTENT -->
<div class="content">
    <div class="card">Ranch OS Dashboard</div>
    <div class="card">Mobile Sidebar Fixed Version</div>
</div>

<script>
const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");
const overlay = document.getElementById("overlay");

function openSidebar() {
    sidebar.classList.add("active");
    overlay.classList.add("active");
    document.body.classList.add("sidebar-open");
}

function closeSidebar() {
    sidebar.classList.remove("active");
    overlay.classList.remove("active");
    document.body.classList.remove("sidebar-open");
}

function toggleSidebar() {
    sidebar.classList.contains("active") ? closeSidebar() : openSidebar();
}

/* OPEN / CLOSE BUTTON */
menuBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    toggleSidebar();
});

/* CLOSE ON MENU CLICK */
document.querySelectorAll(".sidenav a").forEach(link => {
    link.addEventListener("click", closeSidebar);
});

/* CLOSE ON OVERLAY CLICK (MAIN FIX) */
overlay.addEventListener("click", closeSidebar);

/* SAFETY: ESC KEY */
document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeSidebar();
});
</script>

</body>
</html>
