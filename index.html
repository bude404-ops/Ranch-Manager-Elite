<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ranch Manager Elite</title>

<link rel="stylesheet" href="css/styles.css"/>

<style>
/* minimal nav fix so toggle works instantly */
.nav-menu {
    display: none;
    flex-direction: column;
    background: white;
    padding: 10px;
}

.nav-menu.active {
    display: flex;
}
</style>

</head>

<body>

<header>
    <h1 id="ranchTitle">Ranch Dashboard</h1>
    <button onclick="toggleNav()">☰ Menu</button>
</header>

<!-- NAV (FIXED) -->
<nav id="navMenu" class="nav-menu">
    <button onclick="document.getElementById('dashboard').scrollIntoView()">Dashboard</button>
    <button onclick="document.getElementById('animals').scrollIntoView()">Animals</button>
    <button onclick="document.getElementById('inventory').scrollIntoView()">Inventory</button>
</nav>

<main>

<!-- ================= DASHBOARD ================= -->
<section id="dashboard">

    <h2>Overview</h2>

    <div class="card">
        <p>Animals: <span id="animalCount">0</span></p>
        <p>Inventory: <span id="inventoryCount">0</span></p>
    </div>

    <div id="ranchSummary" class="card"></div>

</section>

<!-- ================= ANIMALS ================= -->
<section id="animals">

    <h2>Animals</h2>

    <div class="card">

        <input id="tagNumber" placeholder="Tag Number"/>

        <button onclick="addAnimal()">Add Animal</button>

    </div>

    <div id="animalList"></div>

</section>

<!-- ================= INVENTORY ================= -->
<section id="inventory">

    <h2>Inventory</h2>

    <div class="card">

        <input id="itemName" placeholder="Item Name"/>
        <input id="itemQuantity" type="number" placeholder="Quantity"/>

        <button onclick="addInventoryItem()">Add Item</button>

    </div>

    <div id="inventoryList"></div>

</section>

</main>

<script src="js/app.js"></script>

</body>
</html>
