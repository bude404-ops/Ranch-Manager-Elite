<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ranch OS</title><link rel="manifest"
      href="manifest.json"><link rel="stylesheet"
      href="css/styles.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><header class="header"><div class="header-left">

    <button
        class="menu-btn"
        onclick="toggleSidebar()">

        ☰

    </button>

    <h1 id="ranchTitle">

        Ranch OS

    </h1>

</div>

<div
    id="planBadge"
    class="plan-badge">

    FREE

</div>

</header><nav id="sidebar"
     class="sidebar"><button onclick="showSection('dashboard')">
    Dashboard
</button>

<button onclick="showSection('animals')">
    Livestock
</button>

<button onclick="showSection('paddocks')">
    Paddocks
</button>

<button onclick="showSection('equipment')">
    Equipment
</button>

<button onclick="showSection('employees')">
    Employees
</button>

<button onclick="showSection('workorders')">
    Work Orders
</button>

<button onclick="showSection('finance')">
    Finance
</button>

<button onclick="showSection('settings')">
    Settings
</button>

</nav><main class="main-content"><!-- DASHBOARD --><section
    id="dashboard"
    class="page-section"><h2>Dashboard</h2>

<div class="card-grid">

    <div class="card">
        <h3>Animals</h3>
        <p id="animalCount">0</p>
    </div>

    <div class="card">
        <h3>Paddocks</h3>
        <p id="paddockCount">0</p>
    </div>

    <div class="card">
        <h3>Equipment</h3>
        <p id="equipmentCount">0</p>
    </div>

    <div class="card">
        <h3>Employees</h3>
        <p id="employeeCount">0</p>
    </div>

</div>

<div class="card">

    <h3>Profit Trend</h3>

    <canvas id="profitChart"></canvas>

</div>

</section><!-- ANIMALS --><section
    id="animals"
    class="page-section hidden"><h2>Livestock</h2>

<input
    id="tagNumber"
    placeholder="Tag Number">

<input
    id="species"
    placeholder="Species">

<input
    id="breed"
    placeholder="Breed">

<input
    id="weight"
    placeholder="Weight">

<button
    onclick="addAnimal()">

    Add Animal

</button>

<div
    id="animalList"
    class="list-container">

</div>

</section><!-- PADDOCKS --><section
    id="paddocks"
    class="page-section hidden"><h2>Paddocks</h2>

<input
    id="paddockName"
    placeholder="Paddock Name">

<input
    id="paddockAcres"
    placeholder="Acres">

<button
    onclick="addPaddock()">

    Add Paddock

</button>

<div
    id="paddockList"
    class="list-container">

</div>

</section><!-- EQUIPMENT --><section
    id="equipment"
    class="page-section hidden"><h2>Equipment</h2>

<input
    id="equipmentName"
    placeholder="Equipment Name">

<button
    onclick="addEquipment()">

    Add Equipment

</button>

<div
    id="equipmentList"
    class="list-container">

</div>

</section><!-- EMPLOYEES --><section
    id="employees"
    class="page-section hidden"><h2>Employees</h2>

<input
    id="employeeName"
    placeholder="Employee Name">

<button
    onclick="addEmployee()">

    Add Employee

</button>

<div
    id="employeeList"
    class="list-container">

</div>

</section><!-- WORK ORDERS --><section
    id="workorders"
    class="page-section hidden"><h2>Work Orders</h2>

<input
    id="workTitle"
    placeholder="Work Order Title">

<button
    onclick="addWorkOrder()">

    Add Work Order

</button>

<div
    id="workOrderList"
    class="list-container">

</div>

</section><!-- FINANCE --><section
    id="finance"
    class="page-section hidden"><h2>Finance</h2>

<input
    id="transactionName"
    placeholder="Description">

<input
    id="transactionAmount"
    type="number"
    placeholder="Amount">

<select
    id="transactionType">

    <option value="income">
        Income
    </option>

    <option value="expense">
        Expense
    </option>

</select>

<button
    onclick="addTransaction()">

    Add Transaction

</button>

<div
    id="transactionList"
    class="list-container">

</div>

<div class="card">

    <h3>Tax Summary</h3>

    <p>
        Income:
        <span id="taxIncome">$0.00</span>
    </p>

    <p>
        Expenses:
        <span id="taxExpenses">$0.00</span>
    </p>

    <p>
        Profit:
        <span id="taxProfit">$0.00</span>
    </p>

</div>

</section><!-- SETTINGS --><section
    id="settings"
    class="page-section hidden"><h2>Settings</h2>

<input
    id="ranchNameInput"
    placeholder="Ranch Name">

<button
    onclick="saveSettings()">

    Save Ranch Name

</button>

<hr>

<h3>Enterprise Access</h3>

<input
    id="enterpriseCode"
    placeholder="Code">

<button
    onclick="activateEnterprise()">

    Activate

</button>

</section></main><script src="js/subscriptions.js"></script><script src="js/app.js"></script><script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        () => {

            navigator.serviceWorker
                .register("./sw.js");

        }
    );

}

</script></body>
</html>
